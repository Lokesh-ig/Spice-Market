<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up & Login — Spice Market</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="api.js"></script>

  <style>
    :root {
      --spice-saffron: #ff9e00;
      --spice-chili: #ff4d00;
      --spice-cinnamon: #8b4513;
      --spice-herb: #6b8e23;
      --spice-cream: #fff8f0;
    }

    body {
      background: var(--spice-cream);
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .card-spice {
      border: 1px solid rgba(139, 69, 19, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      background: #ffffff;
    }

    .brand-badge {
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--spice-saffron), var(--spice-chili));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-spice {
      background-image: linear-gradient(90deg, var(--spice-saffron), var(--spice-chili));
      border: 0;
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px;
    }

    .btn-spice:hover,
    .btn-spice:focus {
      filter: brightness(1.05);
      color: #fff;
    }

    .form-control:focus {
      border-color: var(--spice-saffron);
      box-shadow: 0 0 0 .2rem rgba(255, 158, 0, 0.25);
    }

    .nav-pills .nav-link.active {
      background: linear-gradient(90deg, var(--spice-saffron), var(--spice-chili));
      color: #fff;
      border-radius: 10px;
    }

    .nav-pills .nav-link {
      color: #555;
      font-weight: 600;
    }

    .small-muted {
      color: #6c757d;
    }
  </style>
</head>

<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="text-center mb-3">
          <a href="index.html" class="text-decoration-none fw-bold" style="color: var(--spice-chili);">
            ← Back to Spice Market
          </a>
        </div>
        <div class="card card-spice p-4 p-md-5">
          <h1 class="h3 text-center mb-3 brand-badge">🌶 Spice Market Family</h1>

          <!-- Notice when redirected from Checkout / Cart -->
          <div id="checkoutNotice" class="alert alert-warning d-none mb-4 d-flex align-items-center gap-2"
            style="border-radius: 12px;">
            <span class="fs-4">🔒</span>
            <div>
              <strong>Almost there!</strong> Please log in or create an account to place and confirm your spice order.
            </div>
          </div>

          <!-- Auth Tabs: Sign Up vs Login -->
          <ul class="nav nav-pills nav-fill mb-4" id="authTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signupPane"
                type="button" role="tab">Create Account</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginPane" type="button"
                role="tab">Log In</button>
            </li>
          </ul>

          <div class="tab-content" id="authTabContent">
            <!-- SIGN UP PANE -->
            <div class="tab-pane fade show active" id="signupPane" role="tabpanel">
              <form id="signupForm" novalidate>
                <div id="signupAlert" class="alert d-none" role="alert"></div>

                <div class="mb-3">
                  <label for="fullName" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="fullName" placeholder="e.g., Anaya Sharma" required />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
                </div>

                <div class="mb-3">
                  <label for="phone" class="form-label">Phone (optional)</label>
                  <input type="tel" class="form-control" id="phone" placeholder="10-digit number" />
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="6"
                      placeholder="Min 6 characters" required />
                  </div>
                  <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" minlength="6"
                      placeholder="Re-enter password" required />
                  </div>
                </div>

                <button type="submit" id="signupBtn" class="btn btn-spice w-100 py-2 mt-2">Sign Up</button>
              </form>
            </div>

            <!-- LOGIN PANE -->
            <div class="tab-pane fade" id="loginPane" role="tabpanel">
              <form id="loginForm" novalidate>
                <div id="loginAlert" class="alert d-none" role="alert"></div>

                <div class="mb-3">
                  <label for="loginIdentifier" class="form-label">Email or Username</label>
                  <input type="text" class="form-control" id="loginIdentifier" placeholder="you@example.com" required />
                </div>

                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password"
                    required />
                </div>

                <button type="submit" id="loginBtn" class="btn btn-spice w-100 py-2 mt-2">Log In</button>
              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectTarget = urlParams.get('redirect') || 'index.html';
      const initialAction = urlParams.get('action');

      // If redirected from checkout, show notice and optionally activate login tab
      const checkoutNotice = document.getElementById('checkoutNotice');
      if (redirectTarget.toLowerCase().includes('cart') && checkoutNotice) {
        checkoutNotice.classList.remove('d-none');
      }

      if (initialAction === 'login') {
        const loginTabBtn = document.getElementById('login-tab');
        if (loginTabBtn) {
          bootstrap.Tab.getOrCreateInstance(loginTabBtn).show();
        }
      }

      // Sign Up Handler
      const signupForm = document.getElementById('signupForm');
      const signupAlert = document.getElementById('signupAlert');
      const signupBtn = document.getElementById('signupBtn');

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (!name || !email || !pass) {
          showAlert(signupAlert, 'danger', 'Please fill in all required fields.');
          return;
        }

        if (pass.length < 6) {
          showAlert(signupAlert, 'danger', 'Password must be at least 6 characters.');
          return;
        }

        if (pass !== confirm) {
          showAlert(signupAlert, 'danger', 'Passwords do not match.');
          return;
        }

        signupBtn.disabled = true;
        signupBtn.textContent = 'Creating account...';

        try {
          const res = await SpiceAPI.register(name, email, pass, phone);
          showAlert(signupAlert, 'success', '🎉 Welcome to the Spice Family! Account created successfully.');
          signupForm.reset();
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 1200);
        } catch (err) {
          showAlert(signupAlert, 'danger', err.message);
        } finally {
          signupBtn.disabled = false;
          signupBtn.textContent = 'Sign Up';
        }
      });

      // Login Handler
      const loginForm = document.getElementById('loginForm');
      const loginAlert = document.getElementById('loginAlert');
      const loginBtn = document.getElementById('loginBtn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ident = document.getElementById('loginIdentifier').value.trim();
        const pwd = document.getElementById('loginPassword').value;

        if (!ident || !pwd) {
          showAlert(loginAlert, 'danger', 'Please enter your email/username and password.');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        try {
          const res = await SpiceAPI.login(ident, pwd);
          showAlert(loginAlert, 'success', `Welcome back, ${res.user.first_name || res.user.username}!`);
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 900);
        } catch (err) {
          showAlert(loginAlert, 'danger', err.message);
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
        }
      });

      function showAlert(el, type, msg) {
        el.className = `alert alert-${type}`;
        el.textContent = msg;
        el.classList.remove('d-none');
      }
    });
  </script>
</body>

</html>
